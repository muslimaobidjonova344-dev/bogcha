# Lokal ishga tushirish: docker compose -f infrastructure/docker-compose.yml up --build
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: bogcha, POSTGRES_PASSWORD: bogcha, POSTGRES_DB: bogcha }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: { context: ../backend }
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://bogcha:bogcha@db:5432/bogcha
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: [../frontend:/app]
    environment: { BACKEND_URL: "http://backend:8000" }
    command: sh -c "npm install && npm run dev"
    depends_on: [backend]
    ports: ["3000:3000"]
volumes: { pgdata: {} }
