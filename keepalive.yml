# Render bepul rejasida xizmat 15 daqiqa harakatsizlikdan keyin "uxlaydi" va birinchi so'rov 50 soniyagacha kechikadi.
# Bu ish har 10 daqiqada ikkala xizmatga so'rov yuborib, ularni uyg'oq saqlaydi (ilova tez ochiladi).
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend va frontend
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "https://kichkintoy-backend-1nnx.onrender.com/health" || echo "backend javob bermadi"
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 -o /dev/null "https://kichkintoy-frontend.onrender.com/login" || echo "frontend javob bermadi"
